name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject Version into Application
        run: |
          VERSION="1.1.${{ github.run_number }}"
          TODAY=$(date +'%Y-%m-%d')
          echo "RELEASE_TAG=v$VERSION" >> $GITHUB_ENV
          echo "export const APP_VERSION = '$VERSION';" > src/version.ts
          echo "export const APP_BUILD_DATE = '$TODAY';" >> src/version.ts
          echo "export const DEFAULT_GITHUB_REPO = '${{ github.repository }}';" >> src/version.ts

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Capacitor & Android Project
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Marvel App Branding & Launcher Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          
          # Replace default Capacitor icons with custom Marvel Icons in all mipmap sizes
          for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            IFS=":" read -r name size <<< "$density"
            target_dir="android/app/src/main/res/mipmap-$name"
            if [ -d "$target_dir" ]; then
              rsvg-convert -w $size -h $size public/icon-512.svg -o "$target_dir/ic_launcher.png"
              rsvg-convert -w $size -h $size public/icon-512.svg -o "$target_dir/ic_launcher_round.png"
              rsvg-convert -w $size -h $size public/icon-512.svg -o "$target_dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Release Files
        id: prepare_release
        run: |
          mkdir -p release_assets
          VERSION="v1.1.${{ github.run_number }}"
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_OUTPUT
          
          # Use standard universally compatible debug-signed APK
          cp android/app/build/outputs/apk/debug/app-debug.apk release_assets/MarvelChronoTracker.apk
          
          # Create version manifest JSON for in-app auto updater
          printf '{\n  "version": "%s",\n  "buildNumber": %s,\n  "releaseDate": "%s",\n  "apkUrl": "https://github.com/%s/releases/download/%s/MarvelChronoTracker.apk",\n  "releaseNotes": "Mise à jour automatique Marvel Chrono Tracker (Build %s)."\n}\n' \
            "$VERSION" \
            "${{ github.run_number }}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${{ github.repository }}" \
            "$VERSION" \
            "${{ github.run_number }}" > release_assets/version.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarvelChronoTracker-${{ steps.prepare_release.outputs.RELEASE_TAG }}
          path: release_assets/MarvelChronoTracker.apk
          retention-days: 30

      - name: Publish GitHub Release with APK & Manifest
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: ${{ steps.prepare_release.outputs.RELEASE_TAG }}
          name: "Marvel Chrono Tracker ${{ steps.prepare_release.outputs.RELEASE_TAG }}"
          body: |
            🚀 **Nouvelle version automatique de Marvel Chrono Tracker !**
            
            - **Téléchargement direct APK** : [MarvelChronoTracker.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_release.outputs.RELEASE_TAG }}/MarvelChronoTracker.apk)
            - **Date de build** : $(date)
            - **Commit** : ${{ github.sha }}
            
            *Cette mise à jour est automatiquement détectable et téléchargeable depuis l'application mobile.*
          draft: false
          prerelease: false
          files: |
            release_assets/MarvelChronoTracker.apk
            release_assets/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
